services:
  - type: web
    name: promptly
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: pnpm install --frozen-lockfile && PORT=10000 BASE_PATH=/ pnpm run typecheck && PORT=10000 BASE_PATH=/ pnpm --filter @workspace/promptly run build && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      # Keep the existing Render secret name so current deployments do not
      # need the OpenRouter key re-entered. The server also accepts the
      # preferred OPENROUTER_API_KEY name.
      - key: XAI_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "openai/gpt-oss-20b"
